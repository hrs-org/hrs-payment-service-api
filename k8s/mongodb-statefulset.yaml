apiVersion: v1
kind: Secret
metadata:
    name: mongodb-payment-secret
    namespace: uat
type: Opaque
stringData:
    mongodb-root-username: admin
    mongodb-root-password: 38EBD2537A6D4194958B4E83fd1D6!
    mongodb-connection-string: mongodb://admin:38EBD2537A6D4194958B4E83fd1D6!@mongodb-payment.uat.svc.cluster.local:27017
---
apiVersion: v1
kind: Service
metadata:
    name: mongodb-payment
    namespace: uat
    labels:
        app: mongodb-payment
spec:
    ports:
        - port: 27017
          targetPort: 27017
          name: mongodb
    clusterIP: None
    selector:
        app: mongodb-payment
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
    name: mongodb-payment
    namespace: uat
spec:
    serviceName: mongodb-payment
    replicas: 1
    selector:
        matchLabels:
            app: mongodb-payment
    template:
        metadata:
            labels:
                app: mongodb-payment
        spec:
            # SNYK-CC-K8S-6: Add security context at pod level
            securityContext:
                runAsUser: 10999 # MongoDB user (high UID to avoid host clash)
                runAsGroup: 10999 # MongoDB group
                fsGroup: 10999 # MongoDB group
                seccompProfile:
                    type: RuntimeDefault
            containers:
                - name: mongodb
                  image: mongo:7.0
                  ports:
                      - containerPort: 27017
                        name: mongodb
                  env:
                      - name: MONGO_INITDB_ROOT_USERNAME
                        valueFrom:
                            secretKeyRef:
                                name: mongodb-payment-secret
                                key: mongodb-root-username
                      - name: MONGO_INITDB_ROOT_PASSWORD
                        valueFrom:
                            secretKeyRef:
                                name: mongodb-payment-secret
                                key: mongodb-root-password
                  # SNYK-CC-K8S-9, 8, 42: Add container security context (databases need some capabilities)
                  securityContext:
                      allowPrivilegeEscalation: false # SNYK-CC-K8S-8
                      privileged: false # SNYK-CC-K8S-9
                      runAsNonRoot: true # SNYK-CC-K8S-10
                      capabilities:
                          drop:
                              - NET_RAW # SNYK-CC-K8S-41
                              - ALL # Drop all then add back needed ones
                          add:
                              - CHOWN # File ownership changes
                              - SETGID # Required for MongoDB
                              - SETUID # Required for MongoDB
                  volumeMounts:
                      - name: mongodb-data
                        mountPath: /data/db
                  resources:
                      requests:
                          memory: "256Mi"
                          cpu: "250m"
                          ephemeral-storage: "2Gi"
                      limits:
                          memory: "512Mi"
                          cpu: "500m"
                          ephemeral-storage: "5Gi"
                  livenessProbe:
                      tcpSocket:
                          port: 27017
                      initialDelaySeconds: 30
                      periodSeconds: 10
                      timeoutSeconds: 5
                      failureThreshold: 6
                  readinessProbe:
                      tcpSocket:
                          port: 27017
                      initialDelaySeconds: 15
                      periodSeconds: 5
                      timeoutSeconds: 3
                      failureThreshold: 3
    volumeClaimTemplates:
        - metadata:
              name: mongodb-data
          spec:
              accessModes: ["ReadWriteOnce"]
              storageClassName: managed-csi
              resources:
                  requests:
                      storage: 5Gi
