apiVersion: v1
kind: Secret
metadata:
    name: mongodb-payment-secret
    namespace: uat
type: Opaque
stringData:
    mongodb-root-username: __MONGODB_ROOT_USERNAME__
    mongodb-root-password: __MONGODB_ROOT_PASSWORD__
    mongodb-connection-string: __MONGODB_CONNECTION_STRING__
---
apiVersion: v1
kind: Service
metadata:
    name: mongodb-payment
    namespace: uat
    labels:
        app: mongodb-payment
spec:
    ports:
        - port: 27017
          targetPort: 27017
          name: mongodb
    clusterIP: None
    selector:
        app: mongodb-payment
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
    name: mongodb-payment
    namespace: uat
spec:
    serviceName: mongodb-payment
    replicas: 1
    selector:
        matchLabels:
            app: mongodb-payment
    template:
        metadata:
            labels:
                app: mongodb-payment
        spec:
            containers:
                - name: mongodb
                  image: mongo:7.0
                  ports:
                      - containerPort: 27017
                        name: mongodb
                  env:
                      - name: MONGO_INITDB_ROOT_USERNAME
                        valueFrom:
                            secretKeyRef:
                                name: mongodb-payment-secret
                                key: mongodb-root-username
                      - name: MONGO_INITDB_ROOT_PASSWORD
                        valueFrom:
                            secretKeyRef:
                                name: mongodb-payment-secret
                                key: mongodb-root-password
                  volumeMounts:
                      - name: mongodb-data
                        mountPath: /data/db
                  resources:
                      requests:
                          memory: "256Mi"
                          cpu: "250m"
                      limits:
                          memory: "512Mi"
                          cpu: "500m"
                  livenessProbe:
                      tcpSocket:
                          port: 27017
                      initialDelaySeconds: 30
                      periodSeconds: 10
                      timeoutSeconds: 5
                      failureThreshold: 6
                  readinessProbe:
                      tcpSocket:
                          port: 27017
                      initialDelaySeconds: 15
                      periodSeconds: 5
                      timeoutSeconds: 3
                      failureThreshold: 3
    volumeClaimTemplates:
        - metadata:
              name: mongodb-data
          spec:
              accessModes: ["ReadWriteOnce"]
              storageClassName: managed-csi
              resources:
                  requests:
                      storage: 5Gi
