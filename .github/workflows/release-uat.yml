name: Release UAT to AKS

"on":
    workflow_dispatch:
        inputs:
            version:
                description: 'Version to deploy (e.g., 1.0.0, dev-abc123, or "latest")'
                required: true
                default: "latest"
                type: string
            environment:
                description: "Target environment"
                required: true
                default: "uat"
                type: choice
                options:
                    - uat

env:
    AZURE_RESOURCE_GROUP: rg-hrsm-uat
    AKS_CLUSTER_NAME: hrsm-uat-aks
    NAMESPACE: uat
    DEPLOYMENT_NAME: hrs-payment-service
    SERVICE_NAME: hrs-payment-service

jobs:
    deploy-to-aks:
        name: Deploy to AKS ${{ github.event.inputs.environment }}
        runs-on: ubuntu-latest
        environment: ${{ github.event.inputs.environment }}
        permissions:
            contents: read

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Azure CLI
              uses: azure/login@v1
              with:
                  creds: ${{ secrets.AZURE_CREDENTIALS }}

            - name: Set up kubectl
              uses: azure/setup-kubectl@v3
              with:
                  version: "latest"

            - name: Get AKS credentials
              run: |
                  az aks get-credentials \
                    --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
                    --name ${{ env.AKS_CLUSTER_NAME }} \
                    --overwrite-existing

            - name: Create namespace if not exists
              run: |
                  kubectl create namespace ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

            - name: Label namespace for Istio sidecar injection
              run: |
                  kubectl label namespace ${{ env.NAMESPACE }} istio-injection=enabled --overwrite

            - name: Attach ACR to AKS (if not already attached)
              env:
                  ACR_NAME: ${{ secrets.ACR_NAME }}
              run: |
                  az aks update \
                    --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
                    --name ${{ env.AKS_CLUSTER_NAME }} \
                    --attach-acr "$ACR_NAME" || echo "ACR already attached or unable to attach"

            - name: Verify image exists in ACR
              env:
                  ACR_NAME: ${{ secrets.ACR_NAME }}
                  IMAGE_TAG: ${{ github.event.inputs.version }}
              run: |
                  echo "🔍 Verifying image exists in ACR..."

                  # List all available tags
                  echo "Available tags:"
                  az acr repository show-tags \
                    --name "$ACR_NAME" \
                    --repository hrs-payment-service \
                    --orderby time_desc \
                    --output table

                  # Check if specific tag exists
                  if az acr repository show-tags \
                      --name "$ACR_NAME" \
                      --repository hrs-payment-service \
                      --output tsv | grep -Fxq "$IMAGE_TAG"; then
                    echo "✅ Image tag '${IMAGE_TAG}' found in ACR"
                  else
                    echo "❌ Image tag '${IMAGE_TAG}' not found in ACR"
                    echo ""
                    echo "Please use one of the available tags listed above or build the image first."
                    exit 1
                  fi

            - name: Validate deployment secrets
              env:
                  MONGODB_ROOT_PASSWORD: ${{ secrets.MONGODB_ROOT_PASSWORD }}
                  MONGODB_CONNECTION_STRING: ${{ secrets.MONGODB_CONNECTION_STRING }}
                  AUTH0_DOMAIN: ${{ secrets.AUTH0_DOMAIN }}
                  AUTH0_AUDIENCE: ${{ secrets.AUTH0_AUDIENCE }}
                  STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
              run: |
                  missing=0

                  for name in MONGODB_ROOT_PASSWORD MONGODB_CONNECTION_STRING AUTH0_DOMAIN AUTH0_AUDIENCE STRIPE_API_KEY; do
                    if [ -z "${!name}" ]; then
                      echo "❌ Missing required GitHub secret: $name"
                      missing=1
                    fi
                  done

                  if [ "$missing" -ne 0 ]; then
                    exit 1
                  fi

            - name: Prepare deployment manifests
              env:
                  IMAGE_TAG: ${{ github.event.inputs.version }}
                  MONGODB_ROOT_USERNAME: "${{ secrets.MONGODB_ROOT_USERNAME || 'admin' }}"
                  MONGODB_ROOT_PASSWORD: ${{ secrets.MONGODB_ROOT_PASSWORD }}
                  MONGODB_CONNECTION_STRING: ${{ secrets.MONGODB_CONNECTION_STRING }}
                  ACR_NAME: ${{ secrets.ACR_NAME }}
                  AUTH0_DOMAIN: ${{ secrets.AUTH0_DOMAIN }}
                  AUTH0_AUDIENCE: ${{ secrets.AUTH0_AUDIENCE }}
                  ALLOWED_ORIGINS: "${{ secrets.ALLOWED_ORIGINS || 'http://localhost:4200' }}"
                  RENTAL_ORDER_SERVICE: "${{ secrets.RENTAL_ORDER_SERVICE || 'https://hrs-rental-order-service.uat.svc.cluster.local' }}"
                  FRONTEND_URL: "${{ secrets.FRONTEND_URL || 'http://localhost:4200' }}"
                  STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
              run: |
                  echo "Preparing deployment manifests with GitHub secrets..."

                  sed "s|__MONGODB_ROOT_USERNAME__|$MONGODB_ROOT_USERNAME|g" k8s/mongodb-statefulset.yaml | \
                  sed "s|__MONGODB_ROOT_PASSWORD__|$MONGODB_ROOT_PASSWORD|g" | \
                  sed "s|__MONGODB_CONNECTION_STRING__|$MONGODB_CONNECTION_STRING|g" \
                  > k8s/mongodb-statefulset-final.yaml

                  # Replace placeholders in the deployment file
                  sed "s|__ACR_NAME__|$ACR_NAME|g" k8s/deployment-uat.yaml | \
                  sed "s|__IMAGE_TAG__|$IMAGE_TAG|g" | \
                  sed "s|__MONGODB_CONNECTION_STRING__|$MONGODB_CONNECTION_STRING|g" | \
                  sed "s|__AUTH0_DOMAIN__|$AUTH0_DOMAIN|g" | \
                  sed "s|__AUTH0_AUDIENCE__|$AUTH0_AUDIENCE|g" | \
                  sed "s|__ALLOWED_ORIGINS__|$ALLOWED_ORIGINS|g" | \
                  sed "s|__RENTAL_ORDER_SERVICE__|$RENTAL_ORDER_SERVICE|g" | \
                  sed "s|__FRONTEND_URL__|$FRONTEND_URL|g" | \
                  sed "s|__STRIPE_API_KEY__|$STRIPE_API_KEY|g" \
                  > k8s/deployment-final.yaml

                  echo "=== Final Deployment Manifest (sensitive values masked) ==="
                  cat k8s/deployment-final.yaml | grep -v "MONGODB_CONNECTION_STRING" | grep -v "STRIPE_API_KEY" | grep -v "AUTH0_DOMAIN" || cat k8s/deployment-final.yaml

                  echo "=== Final MongoDB Manifest (sensitive values masked) ==="
                  cat k8s/mongodb-statefulset-final.yaml | grep -v "mongodb-root-password" | grep -v "mongodb-connection-string" || cat k8s/mongodb-statefulset-final.yaml

            - name: Ensure MongoDB exists
              run: |
                  echo "Checking MongoDB resources..."

                  if kubectl get secret/mongodb-payment-secret service/mongodb-payment statefulset.apps/mongodb-payment -n ${{ env.NAMESPACE }} >/dev/null 2>&1; then
                    echo "MongoDB resources already exist. Skipping MongoDB apply."
                  else
                    echo "MongoDB resources are missing. Creating MongoDB resources..."
                    kubectl apply -f k8s/mongodb-statefulset-final.yaml
                  fi

            - name: Deploy to AKS
              run: |
                  echo "🚀 Deploying to AKS..."
                  kubectl apply -f k8s/deployment-final.yaml
                  kubectl apply -f k8s/hpa-uat.yaml

                  # Wait for deployment to be fully registered
                  echo "Waiting for deployment to be registered..."
                  for i in {1..10}; do
                    if kubectl get deployment/${{ env.DEPLOYMENT_NAME }} -n ${{ env.NAMESPACE }} &>/dev/null; then
                      echo "✅ Deployment registered"
                      break
                    fi
                    echo "Waiting... ($i/10)"
                    sleep 2
                  done

                  # Annotate deployment with metadata
                  if kubectl get deployment/${{ env.DEPLOYMENT_NAME }} -n ${{ env.NAMESPACE }} &>/dev/null; then
                    kubectl annotate deployment/${{ env.DEPLOYMENT_NAME }} \
                      -n ${{ env.NAMESPACE }} \
                      deployment.kubernetes.io/version="${{ github.event.inputs.version }}" \
                      deployment.kubernetes.io/deployed-by="${{ github.actor }}" \
                      deployment.kubernetes.io/deployed-at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
                      --overwrite
                    echo "✅ Deployment annotated"
                  fi

            - name: Wait for deployment rollout
              run: |
                  echo "⏳ Waiting for deployment to complete..."
                  kubectl rollout status deployment/${{ env.DEPLOYMENT_NAME }} \
                    --namespace=${{ env.NAMESPACE }} \
                    --timeout=300s

            - name: Force restart deployment
              run: |
                  echo "🔄 Forcing deployment restart for clean startup..."
                  kubectl rollout restart deployment/${{ env.DEPLOYMENT_NAME }} -n ${{ env.NAMESPACE }}

            - name: Wait for restart to complete
              run: |
                  echo "⏳ Waiting for restart to complete..."
                  kubectl rollout status deployment/${{ env.DEPLOYMENT_NAME }} \
                    --namespace=${{ env.NAMESPACE }} \
                    --timeout=300s

            - name: Verify Deployment
              run: |
                  echo "=== Pods Status ==="
                  kubectl get pods -n ${{ env.NAMESPACE }}
                  echo ""
                  echo "=== Service Status ==="
                  kubectl get svc -n ${{ env.NAMESPACE }}
                  echo ""
                  echo "=== Recent Pod Logs ==="
                  kubectl logs -n ${{ env.NAMESPACE }} -l app=hrs-payment-service --tail=50

            - name: Run smoke tests
              run: |
                  echo "🧪 Running smoke tests..."

                  # Port forward for testing (runs in background)
                  kubectl port-forward service/${{ env.SERVICE_NAME }} 8080:80 -n ${{ env.NAMESPACE }} &
                  PORT_FORWARD_PID=$!

                  # Wait for port forward to be ready
                  echo "Waiting for port forward to be ready..."
                  sleep 10

                  # Test health endpoint
                  echo "Testing health endpoint..."
                  if curl -f -s http://localhost:8080/health; then
                    echo ""
                    echo "✅ Health check passed"
                    HEALTH_STATUS="success"
                  else
                    echo ""
                    echo "❌ Health check failed"
                    HEALTH_STATUS="failed"
                  fi

                  # Clean up port forward
                  kill $PORT_FORWARD_PID || true

                  # Exit with error if health check failed
                  if [ "$HEALTH_STATUS" = "failed" ]; then
                    exit 1
                  fi

            - name: Post deployment summary
              if: always()
              run: |
                  echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
                  echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
                  echo "| **Service** | Payment Service |" >> $GITHUB_STEP_SUMMARY
                  echo "| **Environment** | \`${{ github.event.inputs.environment }}\` |" >> $GITHUB_STEP_SUMMARY
                  echo "| **Version** | \`${{ github.event.inputs.version }}\` |" >> $GITHUB_STEP_SUMMARY
                  echo "| **Namespace** | \`${{ env.NAMESPACE }}\` |" >> $GITHUB_STEP_SUMMARY
                  echo "| **Cluster** | \`${{ env.AKS_CLUSTER_NAME }}\` |" >> $GITHUB_STEP_SUMMARY
                  echo "| **Deployed by** | @${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
                  echo "| **Deployed at** | $(date -u +'%Y-%m-%d %H:%M:%S UTC') |" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY

                  if [ "${{ job.status }}" == "success" ]; then
                    echo "### ✅ Status: Deployment Successful" >> $GITHUB_STEP_SUMMARY
                  else
                    echo "### ❌ Status: Deployment Failed" >> $GITHUB_STEP_SUMMARY
                  fi

            - name: Azure Logout
              run: az logout
              if: always()

    rollback:
        name: Rollback if needed
        runs-on: ubuntu-latest
        needs: deploy-to-aks
        if: failure()
        environment: ${{ github.event.inputs.environment }}
        permissions: {}
        steps:
            - name: Set up Azure CLI
              uses: azure/login@v1
              with:
                  creds: ${{ secrets.AZURE_CREDENTIALS }}

            - name: Set up kubectl
              uses: azure/setup-kubectl@v3
              with:
                  version: "latest"

            - name: Get AKS credentials
              run: |
                  az aks get-credentials \
                    --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
                    --name ${{ env.AKS_CLUSTER_NAME }} \
                    --overwrite-existing

            - name: Rollback deployment
              run: |
                  echo "Rolling back deployment..."
                  kubectl rollout undo deployment/${{ env.DEPLOYMENT_NAME }} -n ${{ env.NAMESPACE }}
                  kubectl rollout status deployment/${{ env.DEPLOYMENT_NAME }} -n ${{ env.NAMESPACE }} --timeout=300s

                  echo "Rollback completed. Current deployment status:"
                  kubectl get deployment ${{ env.DEPLOYMENT_NAME }} -n ${{ env.NAMESPACE }}

    Integration-Tests:
        name: Integration-Tests
        runs-on: ubuntu-latest
        needs: deploy-to-aks
        environment: ${{ github.event.inputs.environment }}
        steps:
            - name: Set up Azure CLI
              uses: azure/login@v1
              with:
                  creds: ${{ secrets.AZURE_CREDENTIALS }}

            - name: Set up kubectl
              uses: azure/setup-kubectl@v3
              with:
                  version: "latest"

            - name: Get AKS credentials
              run: |
                  az aks get-credentials \
                    --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
                    --name ${{ env.AKS_CLUSTER_NAME }} \
                    --overwrite-existing

            - name: Wait for API and DB workloads
              run: |
                  echo "Waiting for payment API deployment..."
                  kubectl wait \
                    --namespace=${{ env.NAMESPACE }} \
                    --for=condition=available deployment/${{ env.DEPLOYMENT_NAME }} \
                    --timeout=300s

                  echo "Waiting for MongoDB statefulset..."
                  kubectl rollout status \
                    statefulset/mongodb-payment \
                    --namespace=${{ env.NAMESPACE }} \
                    --timeout=300s

            - name: Check payment API health
              env:
                  BASE_URL: ${{ secrets.UAT_API_ENDPOINT }}
              run: |
                  set -euo pipefail

                  BASE_URL="${BASE_URL%/}"
                  if [ -z "$BASE_URL" ]; then
                    echo "UAT_API_ENDPOINT secret is not set"
                    exit 1
                  fi

                  BASE_URL="${BASE_URL%/}"
                  echo "Checking payment API via UAT endpoint: $BASE_URL/health/payment"
                  curl -sSf "$BASE_URL/health/payment" >/dev/null
                  echo "Payment API health check passed"

            - name: Check MongoDB readiness and ping
              env:
                  MONGO_ROOT_USER: ${{ secrets.MONGODB_ROOT_USERNAME || 'admin' }}
                  MONGO_ROOT_PASSWORD: ${{ secrets.MONGODB_ROOT_PASSWORD }}
              run: |
                  set -euo pipefail

                  if [ -z "$MONGO_ROOT_PASSWORD" ]; then
                    echo "Missing required GitHub secret: MONGODB_ROOT_PASSWORD"
                    exit 1
                  fi

                  echo "Checking MongoDB service and endpoints..."
                  kubectl get service mongodb-payment -n ${{ env.NAMESPACE }}
                  MONGO_ENDPOINT_IP=$(kubectl get endpoints mongodb-payment -n ${{ env.NAMESPACE }} -o jsonpath='{.subsets[0].addresses[0].ip}')
                  if [ -z "$MONGO_ENDPOINT_IP" ]; then
                    echo "MongoDB endpoint has no ready addresses"
                    exit 1
                  fi

                  MONGO_POD=$(kubectl get pods -n ${{ env.NAMESPACE }} -l app=mongodb-payment -o jsonpath='{.items[0].metadata.name}')
                  if [ -z "$MONGO_POD" ]; then
                    echo "MongoDB pod not found"
                    exit 1
                  fi

                  echo "Pinging MongoDB with mongosh in pod: $MONGO_POD"
                  MONGO_PING=$(kubectl exec -n ${{ env.NAMESPACE }} "$MONGO_POD" -- mongosh --quiet \
                    --username "$MONGO_ROOT_USER" \
                    --password "$MONGO_ROOT_PASSWORD" \
                    --authenticationDatabase admin \
                    --eval "db.adminCommand({ ping: 1 }).ok")

                  if [ "$MONGO_PING" != "1" ]; then
                    echo "MongoDB ping failed. Result: $MONGO_PING"
                    exit 1
                  fi

                  echo "MongoDB readiness and ping checks passed"

            - name: Post integration summary
              if: always()
              env:
                  BASE_URL: ${{ secrets.UAT_API_ENDPOINT }}
              run: |
                  echo "## 🧪 Integration Test Summary" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
                  echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
                  echo "| **Service** | Payment Service |" >> $GITHUB_STEP_SUMMARY
                  echo "| **Environment** | \`${{ github.event.inputs.environment }}\` |" >> $GITHUB_STEP_SUMMARY
                  echo "| **Namespace** | \`${{ env.NAMESPACE }}\` |" >> $GITHUB_STEP_SUMMARY
                  echo "| **Endpoint** | \`${BASE_URL%/}\` |" >> $GITHUB_STEP_SUMMARY
                  echo "| **Checks** | API health + MongoDB readiness + MongoDB ping |" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY

                  if [ "${{ job.status }}" == "success" ]; then
                    echo "### ✅ Status: Integration Tests Passed" >> $GITHUB_STEP_SUMMARY
                  else
                    echo "### ❌ Status: Integration Tests Failed" >> $GITHUB_STEP_SUMMARY
                  fi
